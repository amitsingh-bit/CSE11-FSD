<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: linear-gradient(white,red);
            background-repeat: no-repeat;
        }
        
        *{
            margin: 0;
            padding: 0;
        }
        nav{
            height: 4rem;
            background-color: rgb(255, 69, 69);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-option{
            display: flex;
        }
        ul li{
            margin: 20px;
            list-style: none;     

        }
        ul li a{
            text-decoration: none; 
            color: white;         
            font-weight: bold;  
            transition: 0.3s;
        }
        ul li a:hover {
            color: black;
        }

        
    </style>
</head>
<body>
    <nav>
        <h2> &nbsp; ZOMATO </h2>
        <ul class="nav-option">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
