<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2 on top, 1 below</title>
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
  }
  .container {
    display: grid;
    grid-template-columns: repeat(2, 400px);
    grid-template-rows: 300px 300px;
    gap: 40px;
    justify-content: center;
  }
  .box {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 300px;
    width: 400px;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    background: #fff;
  }
  .box3 {
    width: 840px;
    grid-column: 1 / 3;
    justify-self: center;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
  </div>
</body>
</html>
