<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --size: 160px; /* base size for squares */
        }
        html,body{
            height:100%;
            margin:0;
        }
        body{
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f0f2f5;
            font-family: system-ui, -apple-system, Arial, sans-serif;
        }
        .grid{
            display:grid;
            grid-template-columns: repeat(2, 1fr);
            gap:20px;
            width: calc(var(--size) * 2 + 20px);
        }
        .box{
            width: var(--size);
            aspect-ratio: 1 / 1; /* keeps it square */
            border-radius:12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-weight:600;
            font-size:16px;
        }
        .box:nth-child(1){ background:#ef476f; } /* pink/red */
        .box:nth-child(2){ background:#ffd166; color:#333; } /* yellow */
        .box:nth-child(3){ background:#06d6a0; } /* green */
        .box:nth-child(4){ background:#118ab2; } /* blue */

        /* responsive: reduce size on small screens */
        @media (max-width:420px){
            :root{ --size: 120px; }
            .grid{ width: calc(var(--size) * 2 + 20px); }
        }
    </style>
</head>
<body>
    <div class="grid" aria-label="four colored squares">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
    </div>
</body>
</html>
